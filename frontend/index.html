<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Support</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            height: 600px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* Header */

        .chat-header {
            background: #2563eb;
            color: white;

            padding: 20px;

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;

            background: white;
            color: #2563eb;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }

        .chat-header h3 {
            font-size: 17px;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.8;

            margin-top: 4px;
        }

        /* Messages */

        #messages {
            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #f8fafc;
        }

        .message {
            max-width: 75%;

            padding: 12px 15px;

            margin-bottom: 12px;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.5;
        }

        .bot {
            background: #e5e7eb;
            color: #111827;

            border-bottom-left-radius: 3px;
        }

        .user {
            background: #2563eb;
            color: white;

            margin-left: auto;

            border-bottom-right-radius: 3px;
        }

        /* Input */

        .chat-input {
            padding: 15px;

            border-top: 1px solid #ddd;

            display: flex;

            gap: 10px;
        }

        .chat-input input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        .chat-input input:focus {
            border-color: #2563eb;
        }

        .chat-input button {
            width: 50px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .chat-input button:hover {
            background: #1d4ed8;
        }

        .chat-input button:active {
            transform: scale(0.95);
        }

        /* Mobile */

        @media (max-width: 500px) {
            .chat-container {
                width: 100%;
                height: 100vh;

                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Chat Header -->

        <div class="chat-header">

            <div class="avatar">
                🤖
            </div>

            <div>
                <h3>Customer Support</h3>
                <p>● Online</p>
            </div>

        </div>


        <!-- Chat Messages -->

        <div id="messages">

            <div class="message bot">
                👋 Hi! Welcome to customer Support.
                How can I help you today?
            </div>

        </div>


        <!-- Chat Input -->

        <div class="chat-input">

            <input
                id="userInput"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
